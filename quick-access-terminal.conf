# Quick-access dropdown terminal (Quake-style). Read only by the
# quick-access-terminal kitten; it inherits your kitty.conf (theme, font, tab bar).
#
# Toggle it by binding this command to a global shortcut (run = show, run again = hide):
#   kitten quick-access-terminal
#   Linux: GNOME/KDE keyboard settings → custom shortcut.
#   macOS: run once, then System Settings → Keyboard → Shortcuts → Services.

edge                top
lines               24
hide_on_focus_loss  yes
background_opacity  0.9
