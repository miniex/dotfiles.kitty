# macOS profile
font_size 18.0

# Invisible titlebar — keeps traffic lights, moves title to menubar
macos_titlebar_color       background
macos_show_window_title_in menubar

# Restore last position/size on dock-click reopen (kovidgoyal/kitty#1197)
remember_window_position   yes
remember_window_size       yes

# Mac-style zoom — fill screen, stay in Space
map ctrl+shift+z toggle_maximized
