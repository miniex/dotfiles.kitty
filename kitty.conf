# ---------------------------------------------------------
# Font Configuration
# ---------------------------------------------------------
font_family      D2Coding
bold_font        D2Coding Bold
italic_font      auto
bold_italic_font auto

# ---------------------------------------------------------
# Symbol Mapping (Nerd Font Integration)
# ---------------------------------------------------------
# Catch-all: route the entire Private Use Area to Symbols Nerd Font Mono
# so every Nerd Font glyph renders (Pomicons, Powerline, FA, FA-Extension,
# Weather, Devicons, Seti, Codicons, Font Logos, Octicons, MDI, Custom — all of it).
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
# Material Design Icons in the Supplementary Private Use Area-A
# (Nerd Font's MDI Desktop block lives at U+F0001-U+F1AF0; extend a bit for headroom)
symbol_map U+F0000-U+F1FFF Symbols Nerd Font Mono
# Non-PUA glyphs that Nerd Font also patches in
symbol_map U+23FB-U+23FE Symbols Nerd Font Mono
symbol_map U+2665 Symbols Nerd Font Mono
symbol_map U+26A1 Symbols Nerd Font Mono
symbol_map U+2B58 Symbols Nerd Font Mono

# ---------------------------------------------------------
# UI & Appearance
# ---------------------------------------------------------
cursor_shape               block
window_padding_width       2
background_opacity         0.85
background                 #1e1e1e
foreground                 #ffffff
active_border_color        #E890B0
inactive_border_color      #E890B0

# ---------------------------------------------------------
# Tab Bar (custom gradient: #98ABCC → #E890B0)
# ---------------------------------------------------------
# Colors are computed per-tab in tab_bar.py based on tab index / total tabs.
tab_bar_style              custom
tab_bar_min_tabs           1
tab_bar_edge               bottom
tab_bar_background         #1e1e1e
tab_separator              ""
tab_title_template         "{index}: {title}"

# ---------------------------------------------------------
# Terminal Behavior
# ---------------------------------------------------------
shell_integration enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ---------------------------------------------------------
# Keyboard Shortcuts
# ---------------------------------------------------------
# Tab management: move tabs forward and backward
map ctrl+shift+k move_tab_forward
map ctrl+shift+j move_tab_backward

# ---------------------------------------------------------
# OS-specific overrides
# ---------------------------------------------------------
# os.conf is generated by install.sh and contains a single `include os/<linux|macos>.conf` line.
# globinclude tolerates a missing file, so kitty still loads cleanly before install.sh runs.
globinclude os.conf
