# ---------------------------------------------------------
# Font Configuration
# ---------------------------------------------------------
font_family      D2Coding Ligature
bold_font        D2Coding Ligature Bold
italic_font      auto
bold_italic_font auto
# for linux
# font_size        12.0
# for mac
# font_size        18.0

# ---------------------------------------------------------
# Symbol Mapping (Nerd Font Integration)
# ---------------------------------------------------------
# Catch-all: route the entire Private Use Area to Symbols Nerd Font Mono
# so every Nerd Font glyph renders (Pomicons, Powerline, FA, FA-Extension,
# Weather, Devicons, Seti, Codicons, Font Logos, Octicons, MDI, Custom — all of it).
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
# Material Design Icons in the Supplementary Private Use Area-A
# (Nerd Font's MDI Desktop block lives at U+F0001-U+F1AF0; extend a bit for headroom)
symbol_map U+F0000-U+F1FFF Symbols Nerd Font Mono
# Non-PUA glyphs that Nerd Font also patches in
symbol_map U+23FB-U+23FE Symbols Nerd Font Mono
symbol_map U+2665 Symbols Nerd Font Mono
symbol_map U+26A1 Symbols Nerd Font Mono
symbol_map U+2B58 Symbols Nerd Font Mono

# ---------------------------------------------------------
# UI & Appearance
# ---------------------------------------------------------
cursor_shape               block
window_padding_width       2
background_opacity         0.85
background                 #1e1e1e
foreground                 #ffffff
# for mac
# hide_window_decorations    titlebar-only

# ---------------------------------------------------------
# Terminal Behavior
# ---------------------------------------------------------
shell_integration enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ---------------------------------------------------------
# Keyboard Shortcuts
# ---------------------------------------------------------
# Tab management: move tabs forward and backward
map ctrl+shift+k move_tab_forward
map ctrl+shift+j move_tab_backward

# for mac
# Window zoom: macOS-style maximize (fills screen without entering fullscreen Space)
# map ctrl+shift+z toggle_maximized
