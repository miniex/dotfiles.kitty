# Fonts
font_family      D2Coding
bold_font        D2Coding Bold
italic_font      auto
bold_italic_font auto

# Nerd Font glyphs — route the whole PUA to Symbols Nerd Font Mono
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
# Re-pin Powerline range — D2Coding overrides it with rectangular glyphs
symbol_map U+E0A0-U+E0D4 Symbols Nerd Font Mono
# MDI Desktop block (with headroom)
symbol_map U+F0000-U+F1FFF Symbols Nerd Font Mono
# Non-PUA codepoints Nerd Font patches
symbol_map U+23FB-U+23FE Symbols Nerd Font Mono
symbol_map U+26A1 Symbols Nerd Font Mono
symbol_map U+2B58 Symbols Nerd Font Mono

# UI & appearance
cursor_shape                 block
cursor_trail                 0

window_padding_width         2
mouse_hide_wait              -1.0
inactive_text_alpha          1.0
enable_audio_bell            no

# Scrollbar — hidden until scroll/hover, faint track
scrollbar                    scrolled-and-hovered
scrollbar_width              0.4
scrollbar_track_opacity      0.05
scrollbar_radius             0.5

# Theme — swap include for themes/light.conf, or `kitten themes` for auto dark/light
include themes/dark.conf

# Tab bar — colors per-tab in tab_bar.py, bar bg follows the active theme
tab_bar_style              custom
tab_bar_min_tabs           1
tab_bar_edge               bottom
tab_separator              ""
tab_title_template         "{index}: {title}"

# Terminal
shell_integration             no-sudo
clipboard_control             write-clipboard write-primary read-clipboard read-primary
paste_actions                 quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large
scrollback_lines              100000
scrollback_pager_history_size 4096
update_check_interval         0

# Confirm window close only when a non-shell program is still running
confirm_os_window_close       -1

# Notify when an unfocused long command (≥10s) finishes
notify_on_cmd_finish invisible 10.0

# Neovim scrollback pager — q to quit; $$ scopes tmp file per shell
scrollback_pager nvim -u NONE -c "map q :qa!<CR>" -c "set clipboard+=unnamedplus shell=$SHELL" -c "autocmd TermOpen * normal G" -c "autocmd TermEnter * stopinsert" -c "autocmd VimLeave * call delete('/tmp/kitty_scrollback_buffer_$$$$')" -c "silent write! /tmp/kitty_scrollback_buffer_$$$$ | te cat /tmp/kitty_scrollback_buffer_$$$$ -"

# `kitty @` remote control — socket-only: via the listen_on socket, not tty escapes
allow_remote_control socket-only
listen_on             unix:/tmp/kitty-{kitty_pid}

# Keys: chord timeout — forgotten chord won't hang state
map_timeout 1.5

# Keys: tab movement
map ctrl+shift+k move_tab_forward
map ctrl+shift+j move_tab_backward

# Keys: jump to tab N (0 = 10)
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10

# Keys: hints kitten — copy URL/hash/IP (defaults still cover open/insert)
map ctrl+shift+u kitten hints --type url  --program @
map ctrl+shift+y kitten hints --type hash --program @
map ctrl+shift+i kitten hints --type ip   --program @

# Keys: shell-integration — needs `shell_integration enabled`
map kitty_mod+g            show_last_command_output
map kitty_mod+y            copy_last_command_output
map kitty_mod+slash        search_scrollback
map kitty_mod+bracketleft  scroll_to_prompt -1
map kitty_mod+bracketright scroll_to_prompt 1

# Keys: Ctrl-L — clear screen + scrollback (next_layout moved to leader>l)
map kitty_mod+l combine : clear_terminal scrollback active : send_text normal,application \x0c

# Keys: font size — 1.0 steps, finer than kitty's 2.0 default
map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+plus      change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# Keys: leader keychain (kitty_mod = ctrl+shift on linux, cmd+shift on macos)
map kitty_mod+space>n new_tab_with_cwd
map kitty_mod+space>w new_window_with_cwd
map kitty_mod+space>x close_tab
map kitty_mod+space>e edit_config_file
map kitty_mod+space>r load_config_file
map kitty_mod+space>t kitten themes --reload-in=all
map kitty_mod+space>p command_palette
map kitty_mod+space>l next_layout
map kitty_mod+space>c clear_terminal scrollback active

# Layouts — splits first so split keys work without cycling
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Keys: splits
map kitty_mod+space>minus     launch --location=hsplit --cwd=current
map kitty_mod+space>backslash launch --location=vsplit --cwd=current
map kitty_mod+space>h         neighboring_window left
map kitty_mod+space>j         neighboring_window down
map kitty_mod+space>k         neighboring_window up
map kitty_mod+space>semicolon neighboring_window right
map kitty_mod+space>z         toggle_layout stack
map kitty_mod+space>q         close_window

# Keys: resize active split
map kitty_mod+space>left      resize_window narrower
map kitty_mod+space>right     resize_window wider
map kitty_mod+space>up        resize_window taller
map kitty_mod+space>down      resize_window shorter
map kitty_mod+space>0         resize_window reset

# OS overrides — os.conf is generated by install.sh; globinclude survives its absence
globinclude os.conf
