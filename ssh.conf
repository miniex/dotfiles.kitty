# kitten ssh — auto-loaded from $XDG_CONFIG_HOME/kitty/ssh.conf
# Activate by aliasing `ssh` to `kitten ssh` in your shell rc.
# Note: only text/background colors change on the remote; padding/opacity stay.

# Default — inherit local cherry-blossom palette
hostname *
color_scheme themes/dark.conf

# Production — red as a safety net
hostname prod-* production-* *.prod *.production
color_scheme Red Sands

# Staging — distinct but non-alarming
hostname staging-* stage-* *.staging
color_scheme Solarized Dark
